## task
name: '3d affordance mask refinement with lifted VGGT features'

## train (consumed by SimpleMaskRefinementTrainLoop)
train:
  lr: 1e-4
  batch_size: 64
  num_workers: 4
  max_steps: 200000
  log_every_step: 100
  save_every_step: 10000

  resume_ckpt: ''
  weight_decay: 0.0
  lr_anneal_steps: 0

  mask_loss_weight: 1.0
  geometry_loss_weight: 0.1
  boundary_loss_weight: 0.5
  smoothness_loss_weight: 0.1
  consistency_loss_weight: 0.2

## test
test:
  batch_size: 32
  num_workers: 0

## dataset
dataset:
  root_dir: 'data'
  split: 'train'
  num_points: 8192
  ## per-sample feature file written by step7b
  vggt_feat_name: 'vggt_feat.npy'
  ## set if extraction used --feat_out_root (mirror tree); null = next to sample files
  vggt_feat_root: null

## evaluation
evaluator:
  eval_nbatch: 1000000000 # evaluate the full set
