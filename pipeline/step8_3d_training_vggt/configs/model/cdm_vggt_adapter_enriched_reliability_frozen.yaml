name: CDMVGGTAdapter

## Preserve the mask-only PointTransformer input path and optimize only the
## zero-initialized VGGT residual adapter.
input_feats: 1
use_vggt: true
use_reliability: true
freeze_base: true

vggt_feat_dim: 256
adapter_hidden_dim: 128

## Four reliability inputs per point:
##   1. within-sample normalized log confidence;
##   2. globally normalized absolute log1p confidence;
##   3. globally normalized log1p contributing-view count;
##   4. observed/unobserved flag.
reliability_mode: enriched

## Fixed moments over the 9,257 non-empty training samples. Reproduce with:
##   scripts/compute_vggt_reliability_stats.py --output \
##     outputs/vggt_reliability_stats/train_nonempty.json
absolute_confidence_log1p_mean: 1.1994825335198414
absolute_confidence_log1p_std: 0.2882688533256349
view_count_log1p_mean: 2.016085461754641
view_count_log1p_std: 0.5476743348668985

scene_model:
  name: 'PointTransformerSeg'
  num_points: ${task.dataset.num_points}
  pretrained_weight:
  freeze: false
