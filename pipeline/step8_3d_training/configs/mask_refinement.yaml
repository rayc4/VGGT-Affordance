data:
  data_dir: "processed_sam2"
  max_points: 65536
  normalize: true

model:
  input_dim: 3
  hidden_dim: 256
  num_layers: 4

training:
  lr: 0.001
  max_epochs: 100
  batch_size: 4
  num_workers: 4
  log_every_epoch: 1
  save_every_epoch: 5
  weight_decay: 0.0001
  lr_anneal_epochs: 80
  resume_ckpt: null

inference:
  batch_size: 1
  threshold: 0.5
  post_process: true
