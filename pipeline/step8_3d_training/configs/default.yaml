## config/default.yaml
hydra:
  run:
    dir: ${exp_dir}
  output_subdir: null

defaults:
  - _self_
  - task: contact_gen
  - model: cdm

## general
project: 'scenediffuser++'  # Board/WanDB project name

## output
output_dir: 'outputs'
exp_name: 'default'

exp_dir: ${output_dir}/${now:%Y-%m-%d_%H-%M-%S}_${exp_name}
log_dir: ${exp_dir}/log
ckpt_dir: ${exp_dir}/ckpt
eval_dir: ${exp_dir}/eval
# Optional explicit model checkpoint for evaluation. When null, the evaluator
# retains its original behavior and selects the latest checkpoint in ckpt_dir.
checkpoint: null

platform: 'TensorBoard' # ['TensorBoard', 'WanDB']

## device
gpu: 0

## diffusion
## Kept because create_gaussian_diffusion() reads every key below at model-build
## time. train_no_diff discards the diffusion object, but removing these crashes it.
diffusion:
  predict_xstart: true
  steps: 1000
  noise_schedule: 'cosine'
  timestep_respacing: ''
  rescale_timesteps: false
  loss_type: 'MSE'
  learn_sigma: false
  sigma_small: true

## random seed
seed: 2023  # read by eval_no_diff.py
