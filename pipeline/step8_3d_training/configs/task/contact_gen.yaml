## train (consumed by SimpleMaskRefinementTrainLoop; batch_size/num_workers by train_no_diff)
train:
  lr: 1e-4
  batch_size: 64
  num_workers: 4
  val_batch_size: 32
  val_num_workers: 2
  max_steps: 50000 # hard ceiling; validation early stopping normally ends sooner
  log_every_step: 100 # log every ${log_every_step} steps
  resume_ckpt: '' # resume from checkpoint
  weight_decay: 1e-4
  lr_anneal_steps: 0
  ## Overlap losses and focal weighting address point-level class imbalance.
  bce_loss_weight: 0.15
  dice_loss_weight: 0.35
  focal_loss_weight: 0.15
  iou_loss_weight: 0.35
  focal_alpha: 0.75
  focal_gamma: 2.0
  validation_threshold: 0.5
  validate_every_epoch: 1
  ## Select checkpoints by macro per-frame pointwise AP computed from
  ## continuous probabilities. Patience is counted in validation runs.
  early_stopping_metric: mAP
  early_stopping_mode: max
  ## Optional eligibility constraint: among checkpoints at or above this
  ## hard-mask AP50 floor, retain the one with the highest monitored metric.
  best_checkpoint_ap50_floor: null
  early_stopping_patience: 15
  early_stopping_min_delta: 0
  early_stopping_warmup_epochs: 10

## test (consumed by eval_no_diff.py)
test:
  batch_size: 32
  num_workers: 0

## dataset
## AffordanceDataset takes most of its args explicitly in code and ignores the rest of
## this block; num_points survives because the model interpolates
## ${task.dataset.num_points}, and require_nonempty_gt is read by train_no_diff.
dataset:
  num_points: 8192
  ## Drop frame crops whose gt_mask_local is empty.
  require_nonempty_gt: true

## evaluation (only eval_nbatch is read, by eval_no_diff.py)
evaluator:
  eval_nbatch: 99999999
