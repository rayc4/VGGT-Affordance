## train (consumed by SimpleMaskRefinementTrainLoop; batch_size/num_workers by train_no_diff)
train:
  lr: 1e-4
  batch_size: 64
  num_workers: 4
  max_steps: 100000 # max steps to train
  log_every_step: 100 # log every ${log_every_step} steps
  save_every_step: 10000 # save model every ${save_every_step} steps
  resume_ckpt: '' # resume from checkpoint
  weight_decay: 0.0
  lr_anneal_steps: 0

## test (consumed by eval_no_diff.py)
test:
  batch_size: 32
  num_workers: 0

## dataset
## AffordanceDataset takes most of its args explicitly in code and ignores the rest of
## this block; num_points survives because the model interpolates
## ${task.dataset.num_points}, and require_nonempty_gt is read by train_no_diff.
dataset:
  num_points: 8192
  ## Drop samples whose gt_mask_local is all zeros (the crop is centred on the lifted
  ## prediction, so an off-target prediction leaves the annotation outside the crop).
  ## ~66% of the train split; keeping them teaches the model to predict empty masks.
  require_nonempty_gt: true

## evaluation (only eval_nbatch is read, by eval_no_diff.py)
evaluator:
  eval_nbatch: 100
