# Reproducible TASA preprocessing environment for Linux x86_64 with NVIDIA GPUs.
# Create it with: PYTHONNOUSERSITE=1 conda env create -f tasa_env.yml
#
# PyTorch and the compiled PyG extensions must come from their CUDA 12.4 wheel
# repositories. The host NVIDIA driver must support CUDA 12.4; a system CUDA
# toolkit is not required to run these wheels.
name: tasa
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.10.20
  - pip=26.1.2
  - setuptools=81.0.0
  - wheel=0.47.0
  - git
  # Keep the numerical stack in Conda so its native libraries are solved
  # together. OpenCV 4.11 is the final release compatible with NumPy 1.x.
  - numpy=1.26.4
  - scipy=1.13.1
  - cffi=2.0.0
  - packaging=26.2
  - pycparser=3.0
  - typing_extensions=4.15.0
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - --find-links https://data.pyg.org/whl/torch-2.4.0+cu124.html

      # Pin the complete Python dependency closure to prevent transitive drift.
      - absl-py==2.4.0
      - addict==2.4.0
      - aiohappyeyeballs==2.6.2
      - aiohttp==3.14.1
      - aiosignal==1.4.0
